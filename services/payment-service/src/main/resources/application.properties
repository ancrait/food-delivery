spring.application.name=payment-service

server.port=8086

spring.datasource.url=jdbc:postgresql://${DB_HOST_PAY}:${DB_PORT_PAY}/${DB_NAME_PAY}
spring.datasource.username=${DB_USERNAME_PAY}
spring.datasource.password=${DB_PASSWORD_PAY}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sorokaandriy.order_service,com.sorokaandriy.payment_service
spring.kafka.consumer.properties.spring.json.type.mapping=com.sorokaandriy.order_service.dto.OrderCreatedEvent:com.sorokaandriy.payment_service.dto.OrderCreatedEvent,com.sorokaandriy.order_service.dto.OrderCancelledEvent:com.sorokaandriy.payment_service.dto.OrderCancelledEvent
spring.kafka.consumer.auto-offset-reset=earliest

jwt.secret=${JWT_SECRET}

kafka.topics.order-created=order-created
kafka.topics.order-cancel=order-cancel
kafka.topics.payment-success=payment-success
kafka.topics.payment-cancel=payment-cancel

stripe.publish-key=${PAYMENT_PUBLISH_KEY}
stripe.secret-key=${PAYMENT_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

logging.level.com.sorokaandriy.payment_service=DEBUG
