spring.application.name=rider-tracking

server.port=8085

spring.datasource.url=jdbc:postgresql://${DB_HOST_TRAC}:${DB_PORT_TRAC}/${DB_NAME_TRAC}
spring.datasource.username=${DB_USERNAME_TRAC}
spring.datasource.password=${DB_PASSWORD_TRAC}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}

logging.level.com.sorokaandriy.rider_tracking=DEBUG
